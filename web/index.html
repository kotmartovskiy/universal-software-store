<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Universal Software Store</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px;background:#f5f6f8;color:#20242a}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:16px 0}.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#e8f2ff;margin:3px}</style></head><body><h1>Universal Software Store</h1><p>Software × Device × OS × Version × Time</p><div class='card'><h2>Prototype</h2><p>Local catalog shell. Next: deterministic compatibility rules, releases/packages, provenance and emulator adapters.</p></div><div class='card'><h2>Device profiles</h2><div id='devices'>Loading...</div></div><script>fetch('/api/devices').then(r=>r.json()).then(d=>{document.getElementById('devices').innerHTML=d.devices.map(x=>'<div class="card"><b>'+x.vendor+' '+x.model+'</b><br>'+x.cpu.architecture+' · '+x.os.family+' '+x.os.version+'<br>'+x.formats.map(f=>'<span class="badge">'+f+'</span>').join('')+'</div>').join('')})</script></body></html>
